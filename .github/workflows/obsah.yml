# Obsah webu z arling-obsah: stiahne realizácie, novinky a fotky z Facebooku a zo správy do obsah/, uloží zmenu do main,
# zostaví web a nasadí GitHub Pages.
# Premenná repozitára OBSAH_API, napríklad https://arling-obsah.<subdoména>.workers.dev/api/bmbuilding (verejné API, bez tajomstva).
# Nasadzuje len GitHub Pages. Pri ceste FTP na WebHouse ide ostrý web na doménu ručne (build.py --hosting apache
# a WinSCP, postup SPUSTENIE-FTP.md v priečinku klienta): úloha FTP tu zámerne nie je, lebo súbory nahraté jedným
# FTP účtom smie na WebHouse meniť len ten účet a prvý beh by išiel neoverený rovno na ostrý web.
name: Obsah

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      povol_prazdne:
        description: "Bez účinku od sťahovača verzie 2 (podľa chýbania v API sa nič nemaže)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: obsah
  cancel-in-progress: false

jobs:
  obsah:
    runs-on: ubuntu-latest
    # Úloha len sťahuje a commituje obsah; Pages a OIDC nepotrebuje (užšie ako spoločné oprávnenia vyššie).
    permissions:
      contents: write
    outputs:
      zmena: ${{ steps.ulozit.outputs.zmena }}
      sha: ${{ steps.ulozit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Vypínač (Fable 22. 11. 2026): premenná repozitára OBSAH_SYNC=vypnute preskočí sťahovanie. Sťahovač verzie 2
      # (fb-ostro, 23. 11. 2026) mení len položky z Facebooku a zo správy a maže len id zo zoznamu stiahnute z API,
      # takže zapnutie nepotrebuje dorovnanie D1; staré realizácie a novinky ostávajú v repozitári.
      - name: Stiahnuť obsah z arling-obsah
        if: ${{ vars.OBSAH_SYNC != 'vypnute' }}
        env:
          OBSAH_API: ${{ vars.OBSAH_API }}
          POVOL_PRAZDNE: ${{ inputs.povol_prazdne }}
        run: |
          if [ "$POVOL_PRAZDNE" = "true" ]; then
            python .github/obsah/stiahni.py --api "$OBSAH_API" --obsah obsah --povol-prazdne
          else
            python .github/obsah/stiahni.py --api "$OBSAH_API" --obsah obsah
          fi

      # Brzda mazania (fb-ostro A3, OPONENT.md S1): viac ako 20 súborov odobratých z obsah/ je chyba kroku bez commitu
      # a bez pushu, úloha nasadenie sa nespustí a na webe ostane posledná dobrá verzia. Jedna položka zmaže najviac
      # 1 JSON a 16 fotiek. Väčšie mazanie, ktoré je v poriadku, ide commitom z PC (README, Brzda mazania).
      # --no-renames: aj súbor, ktorý git spáruje s novým ako premenovanie, sa ráta ako odobratý.
      - name: Uložiť zmenu obsahu do main
        id: ulozit
        shell: bash
        run: |
          git add -A obsah
          zmazane=$(git diff --cached --no-renames --name-only --diff-filter=D -- obsah)
          pocet=$(grep -c . <<< "$zmazane" || true)
          if [ "$pocet" -gt 20 ]; then
            echo "::error title=Brzda mazania::Zmena obsahu maže $pocet súborov v obsah/ (najviac 20). Nič som necommitol, web ostáva posledný dobrý. Príčina je v kroku Stiahnuť obsah."
            head -n 50 <<< "$zmazane"
            exit 1
          fi
          if git diff --cached --quiet -- obsah; then
            echo "zmena=nie" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # Push vstavaným tokenom úlohy nový beh nespustí; [skip ci] je druhá poistka proti slučke push a workflow.
            git commit -m "obsah: aktualizácia z arling-obsah [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "zmena=ano" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  nasadenie:
    needs: obsah
    if: github.event_name != 'schedule' || needs.obsah.outputs.zmena == 'ano'
    runs-on: ubuntu-latest
    # Nasadenie nič nepushuje: obsah len na čítanie, Pages a OIDC pre deploy-pages.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.nasadit.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.obsah.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # build.py potrebuje Pillow (zmenšenie fotiek na webp, obrázok Open Graph); verzia rovnaká ako pri lokálnej zostave.
      - name: Nainštalovať Pillow
        run: python -m pip install --disable-pip-version-check "pillow==11.3.0"

      # Ostrý web až po prepnutí domény: premenná repozitára BMB_OSTRY=ano (gh variable set BMB_OSTRY --body ano).
      # Bez nej build.py v Actions zostaví náhľad s noindex (PRESUN-DOMENY.md, kontrola 21. 11. 2026).
      - name: Zostaviť web
        env:
          BMB_OSTRY: ${{ vars.BMB_OSTRY }}
        run: python build.py

      # .zostava.json je zoznam súborov, ktoré zostava zapísala (zostava ho číta pri ďalšom behe na mazanie starých
      # výstupov); na web nepatrí, artefakt Pages by ho zverejnil (audit naplno 25. 11. 2026, položka 42).
      - name: Odstrániť zoznam zostavy z webu
        run: rm -f web/.zostava.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Nasadiť GitHub Pages
        id: nasadit
        uses: actions/deploy-pages@v4
